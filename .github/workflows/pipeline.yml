name: AgroCast Pipeline (every 6h)

# Free tier: 2000 min/month for private repos, unlimited for public.
# Cada corrida ~5–8 min × 4/día × 30 = ~600–960 min/mes. Cabe holgado.

on:
  schedule:
    # 00:00, 06:00, 12:00, 18:00 UTC (≈ 21:00, 03:00, 09:00, 15:00 UY)
    - cron: "0 */6 * * *"
  workflow_dispatch: {}     # botón "Run workflow" en GitHub UI

permissions:
  contents: write           # para commitear data/ y artifacts/

concurrency:
  group: agrocast-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      NEWSAPI_KEY:       ${{ secrets.NEWSAPI_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
      AGROCAST_API_KEY:   ${{ secrets.AGROCAST_API_KEY }}
      TZ: America/Montevideo

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        run: |
          python -m src.pipeline
        continue-on-error: false

      - name: Run lookahead audit (best-effort)
        run: |
          python -m src.model.audit_lookahead || echo "audit failed (non-blocking)"
        continue-on-error: true

      - name: Show artifacts size
        run: |
          du -sh data artifacts || true
          ls -la artifacts || true

      - name: Commit refreshed artifacts
        run: |
          git config user.name  "agrocast-bot"
          git config user.email "agrocast-bot@users.noreply.github.com"
          git add -A data/ artifacts/ || true
          # No-op si no cambió nada
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: refresh pipeline artifacts ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi

      - name: Notify on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=⚠️ AgroCast pipeline FAILED on GitHub Actions. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || true
